<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140f0b">
<title>天下三分 国取り戦略</title>
<style>
/* ===== 基本カラー（墨・朱・金） ===== */
:root{
  --ink:#140f0b; --ink2:#221a14; --ink3:#33281f; --line:#4a3a2a;
  --paper:#f1e6cf; --red:#b8322a; --red2:#8e231c; --gold:#d4a845; --gold2:#f0d27a;
  --text:#f1e6cf; --muted:#b3a284; --good:#8fd07a; --bad:#ff7a6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0705;color:var(--text);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#app{position:relative;max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at top,#2c2219,#120d09 70%);box-shadow:0 0 30px #000}

/* ===== ヘッダー ===== */
#hdr{padding:6px 8px 6px;padding-top:calc(6px + env(safe-area-inset-top));background:linear-gradient(#0e0a07,#211912);border-bottom:2px solid var(--gold)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.rc{background:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:3px 2px;font-size:11px;text-align:center;line-height:1.25}
.rc b{display:block;font-size:14px;color:var(--gold2)}
.rc small{color:var(--good);font-size:10px}
.hrow{display:flex;align-items:center;gap:8px;margin-top:6px}
#turnLbl{flex:1;text-align:center;color:var(--gold2);font-size:16px;letter-spacing:1px}

/* ===== ボタン ===== */
.btn{min-height:44px;min-width:44px;border:1px solid var(--gold);background:linear-gradient(#c93d32,var(--red2));color:#fff3d6;
  border-radius:8px;font-weight:bold;padding:0 14px;font-size:15px;cursor:pointer}
.btn.sub{background:linear-gradient(#3a2e24,#211912);color:var(--gold2)}
.btn:disabled{opacity:.38;cursor:default}
.btn:not(:disabled):active{transform:scale(.97)}
.btn.wide{width:100%;margin-top:8px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px}
.btn.big{min-height:52px;font-size:17px;justify-content:center;text-align:center}

/* ===== メイン領域・タブ ===== */
#main{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;padding:10px 10px 24px;display:none;-webkit-overflow-scrolling:touch}
.tab.on{display:block}
#tab-map{padding:0;overflow:hidden}
#map{width:100%;height:100%;touch-action:none;display:block;background:#1a130e}
#legend{position:absolute;left:8px;right:92px;top:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
#legend span{font-size:12px;padding:3px 7px;border-radius:12px;background:rgba(20,15,11,.85);border:1px solid var(--line)}
#mhint{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);font-size:12px;line-height:1.5;padding:6px 12px;border-radius:14px;background:rgba(20,15,11,.88);border:1px solid var(--gold);color:var(--gold2);max-width:94%;width:max-content;text-align:center}
.minibtn{min-height:32px;padding:0 10px;margin-left:6px;border-radius:8px;border:1px solid var(--gold);background:var(--red2);color:#fff3d6;font-size:12px;font-family:inherit;cursor:pointer}
/* 偵察 */
#scoutBtn{position:absolute;right:8px;top:8px;min-height:42px;padding:0 14px;border-radius:21px;border:2px solid var(--gold2);background:linear-gradient(#d0463a,var(--red2));color:#fff6e0;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.8);text-shadow:0 1px 2px rgba(0,0,0,.6)}
#logBtn{position:absolute;right:8px;top:56px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--gold);background:linear-gradient(#3a2e24,#211912);color:var(--gold2);font-family:inherit;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.8)}
#scoutBtn.used{background:linear-gradient(#4a3a2c,#2a1f16);border-color:var(--gold);color:var(--gold2)}
.sclist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;margin:8px 0}
.sclist button{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:48px;padding:6px 10px;border-radius:8px;border:1px solid #c9b48a;background:#fff8;color:#2a1c12;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.sclist button small{color:#6a4a2a;font-size:12px}
.scres{font-size:13px;line-height:1.6;padding:6px 8px;margin:4px 0;border-left:3px solid var(--red);background:#fff6;border-radius:4px}
/* マップ下の部隊タブ */
#abar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:rgba(14,10,7,.95);border-top:1px solid var(--gold);scrollbar-width:none}
#abar::-webkit-scrollbar{display:none}
#abar button{flex:1 0 auto;min-width:84px;min-height:52px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--ink2);color:var(--text);font-family:inherit;font-size:12px;line-height:1.35;cursor:pointer;text-align:center}
#abar button b{display:block;font-size:13px;color:var(--gold2)}
#abar button.on{border:2px solid var(--gold2);background:linear-gradient(#5a2018,#2a120d)}
#abar button.done{opacity:.6}
#abar .none{color:var(--muted);font-size:12px;padding:10px 4px}
/* 貿易 */
.rtab{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.rtab th,.rtab td{border:1px solid var(--line);padding:4px 2px;text-align:center}
.rtab th{color:var(--muted);font-weight:normal}
.rtab .cur{background:#4a1a14;color:var(--gold2);font-weight:bold}
.rhi{color:var(--good)} .rlo{color:var(--bad)}
.tsel{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.tsel button{min-height:44px;border:1px solid var(--line);background:var(--ink);color:var(--text);border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer}
.tsel button.on{border-color:var(--gold2);background:#4a1a14;color:var(--gold2);font-weight:bold}
.tsel button:disabled{opacity:.3}
.tprev{text-align:center;font-size:15px;margin:10px 0 2px;color:var(--gold2)}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}

/* ===== 下部ナビ ===== */
#nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--gold);background:#0e0a07;padding-bottom:env(safe-area-inset-bottom)}
#nav button{min-height:58px;background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
#nav button span{font-size:20px;line-height:1}
#nav button.on{color:var(--gold2);background:linear-gradient(transparent,#4a1a14)}

/* ===== マス情報シート ===== */
#sheet{position:absolute;left:8px;right:8px;bottom:72px;max-height:48%;overflow-y:auto;background:rgba(24,18,13,.97);
  border:1px solid var(--gold);border-radius:12px;padding:10px 12px 12px;display:none;box-shadow:0 -4px 24px rgba(0,0,0,.7)}
#sheet.on{display:block}
.shd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tname{font-size:18px;color:var(--gold2)}
.x{min-width:44px;min-height:44px;background:none;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:18px;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;color:#fff;margin-left:4px;vertical-align:2px}
.tag.gold{background:var(--gold);color:#2a1c12}
.srow{font-size:13px;color:var(--muted);margin-top:3px}
.note{font-size:13px;margin-top:8px;color:var(--text)}
.est{font-size:12px;padding:2px 8px;border-radius:10px;background:#0006;white-space:nowrap}
.est.good{color:var(--good)} .est.even{color:var(--gold2)} .est.bad{color:var(--bad)}

/* ===== カード類 ===== */
.sec{font-size:15px;color:var(--gold2);margin:6px 0 8px;padding-left:10px;border-left:4px solid var(--red)}
.card{background:linear-gradient(#2a2019,#1c1510);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:#0005;border:1px solid var(--line);border-radius:12px;padding:3px 9px}
.chip.ng{color:var(--bad);border-color:#7a2a22}
.bh{display:flex;justify-content:space-between;align-items:center}
.bh b{font-size:16px}
.lv{color:var(--gold2);font-size:13px}
.desc{font-size:12px;color:var(--muted);margin:4px 0 6px}
.bld .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gh b{font-size:16px}
.where{margin-left:auto;font-size:12px;color:var(--muted)}
.tb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;color:#fff;font-weight:bold;flex:none}
.t-cav{background:#a8502a} .t-shd{background:#4f6b3a} .t-spr{background:#8a6a2a} .t-arc{background:#3f5f8a} .t-siege{background:#6b5a7a}
.apt{font-weight:bold} .apt-S{color:#ffd76a} .apt-A{color:#f0e0b0} .apt-B{color:#c8b890} .apt-C{color:#9a8a70} .apt-D{color:#7a6a5a}
.tsel4{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.tsel4 button{min-height:44px;border:1px solid var(--line);background:var(--ink);color:var(--text);border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;line-height:1.3}
.tsel4 button.on{border-color:var(--gold2);background:#4a1a14;color:var(--gold2);font-weight:bold}
.tsel4 button:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.st{display:flex;align-items:center;gap:5px;font-size:12px}
.st i,.bar,.exp i{flex:1;height:7px;background:#0007;border-radius:4px;overflow:hidden;display:block}
.st em,.bar em,.exp em{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.st b{width:24px;text-align:right;color:var(--gold2)}
.exp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.slot{display:flex;align-items:center;gap:8px;margin-top:8px}
.slot label{width:34px;font-size:12px;color:var(--muted);flex:none}
.slot select{flex:1;min-height:44px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:15px;padding:0 8px}
.trow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:4px 0 0 42px}
.sline{gap:4px;flex-wrap:wrap}
.sv{font-size:11px;padding:1px 6px;border-radius:8px;background:#0006;border:1px solid var(--line);color:var(--muted)}
.sv b{margin-left:2px;color:var(--text)}
.sv.md b{color:var(--gold2)} .sv.hi{border-color:var(--gold)} .sv.hi b{color:#fff3a0}
.trow .bar em{background:linear-gradient(90deg,#8e231c,#e0574a)}
.status{font-size:12px;padding:2px 8px;border-radius:10px;background:#0006}
.status.done{color:var(--muted)} .status.ready{color:var(--good)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 12px}

/* ===== タイトル画面 ===== */
#title{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#3a1d14,#0a0705 70%)}
.tin{width:100%;max-width:480px;padding:28px 22px;display:flex;flex-direction:column;align-items:stretch;overflow-y:auto}
.seal{width:64px;height:64px;margin:10px auto 0;border:3px solid var(--red);color:var(--red);font-size:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;transform:rotate(-6deg);background:#f1e6cf10}
#title h1{text-align:center;font-size:46px;letter-spacing:10px;margin:14px 0 0;color:var(--gold2);text-shadow:0 2px 0 #000,0 0 18px #d4a84555}
.tsub{text-align:center;color:var(--muted);margin:4px 0 20px;letter-spacing:3px}
.tlabel{font-size:13px;color:var(--gold);margin:14px 0 6px}
.facsel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fbtn{min-height:76px;border-radius:10px;border:2px solid var(--line);background:var(--ink2);color:#fff;font-size:28px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fbtn small{font-size:12px;font-weight:normal;color:var(--muted)}
.fbtn.on{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold) inset}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--gold);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;background:var(--ink2);color:var(--muted);border:none;font-size:14px;cursor:pointer}
.seg button.on{background:var(--red2);color:#fff3d6;font-weight:bold}
#newBtn{margin-top:22px}

/* ===== モーダル ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.on{display:flex}
#mbox{width:100%;max-width:456px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--paper);color:#2a1c12;border:3px double var(--red);border-radius:10px;padding:14px 14px 16px}
#mbox h2{margin:0 0 10px;font-size:20px;color:var(--red2);text-align:center}
#mbox .sub{font-weight:bold;margin:10px 0 6px;color:#5a3a1e}
#mbox .btn.sub{margin:0;background:linear-gradient(#fffaf0,#e9dcc0);color:#2a1c12;border:2px solid #8a6a3a;font-weight:bold}
#mbox.dark .btn.sub{background:linear-gradient(#3a2e24,#211912);color:var(--gold2);border:1px solid var(--gold)}
#mbox .chip{background:#fff6;border-color:#c9b48a;color:#2a1c12}
#mbox ol{padding-left:20px;margin:0} #mbox li{margin-bottom:8px;font-size:14px;line-height:1.6}
.rp{font-size:13px;padding:6px 8px;border-bottom:1px dashed #c9b48a}
.rp.warn{color:#9a1f15;font-weight:bold}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns .btn{flex:1}
#mbox.dark{background:linear-gradient(#241b14,#120d09);color:var(--text);border-color:var(--gold)}

/* ===== 戦闘画面 ===== */
.btitle{text-align:center;font-size:17px;color:var(--gold2);margin-bottom:8px}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bsh{font-size:13px;text-align:center;margin-bottom:4px;font-weight:bold}
.bu{background:#0006;border:1px solid var(--line);border-radius:8px;padding:5px 6px;margin-bottom:5px}
.bun{font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.bun .tb{width:18px;height:18px;font-size:10px}
.bu .bar{margin-top:4px;height:8px}
.bu .bar em{background:linear-gradient(90deg,#8e231c,#e0574a);transition:width .3s}
.bnum{font-size:11px;color:var(--muted);text-align:right}
.bu.dead{opacity:.35;filter:grayscale(1)}
.bu.hit{animation:hit .35s}
.bu.act{animation:act .35s}
@keyframes hit{0%{background:#8e231c;transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}100%{transform:none}}
@keyframes act{0%{box-shadow:0 0 0 2px var(--gold2)}100%{box-shadow:none}}
.blog{height:170px;overflow-y:auto;background:#0008;border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:6px 8px;font-size:12px;line-height:1.6}
.bl.hdr{color:var(--gold);text-align:center}
.bl.strat{color:#9fc8ff}
.bres{text-align:center;font-size:30px;font-weight:bold;letter-spacing:8px;margin-top:10px}
.bres.win{color:var(--gold2);text-shadow:0 0 12px #d4a845}
.bres.lose{color:var(--bad)}
.bres.draw{color:#9fc8ff}
.pinbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;min-height:56px;margin-bottom:6px;padding:8px 10px;border:2px solid #c9b48a;border-radius:10px;background:#fff8;color:#2a1c12;font-family:inherit;font-size:14px;cursor:pointer}
.pinbtn.on{border-color:var(--red);background:#fde9d9}
.pinbtn:disabled{opacity:1;cursor:default;background:#f3e3c4}
.pinchk{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid #8e6a3a;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:bold}
.engc{background:#fff7;border:1px solid #c9b48a;border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px}
.bmsg{font-size:13px;text-align:center;color:var(--text);margin-top:4px}

/* ===== トースト ===== */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,15,11,.95);border:1px solid var(--gold);color:var(--gold2);
  padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- ===== メイン画面 ===== -->
<div id="app">
  <header id="hdr">
    <div class="res" id="resBar"></div>
    <div class="hrow">
      <button class="btn sub" id="menuBtn" aria-label="メニュー">☰</button>
      <div id="turnLbl"></div>
      <button class="btn" id="endBtn">ターン終了</button>
    </div>
  </header>
  <main id="main">
    <section class="tab on" id="tab-map">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="mapg"></g></svg>
      <div id="legend"></div>
      <button id="scoutBtn" onclick="openScout()">🔍 偵察</button>
      <button id="logBtn" onclick="showLogs()">📜 報告</button>
      <div id="mhint">👤 部隊をタップ → 光るマスへ移動／赤い点線のマスを攻撃</div>
      <div id="sheet"></div>
      <div id="abar"></div>
    </section>
    <section class="tab" id="tab-gov"></section>
    <section class="tab" id="tab-gen"></section>
    <section class="tab" id="tab-army"></section>
    <section class="tab" id="tab-dip"></section>
  </main>
  <nav id="nav">
    <button data-tab="map" class="on"><span>🗺️</span>マップ</button>
    <button data-tab="gov"><span>🏛️</span>内政</button>
    <button data-tab="gen"><span>👤</span>武将</button>
    <button data-tab="army"><span>⚔️</span>部隊</button>
    <button data-tab="dip"><span>🤝</span>外交</button>
  </nav>
</div>

<!-- ===== タイトル画面 ===== -->
<div id="title">
  <div class="tin">
    <div class="seal">戦</div>
    <h1>天下三分</h1>
    <p class="tsub">― 三国国取り戦略 ―</p>
    <div class="tlabel">勢力を選ぶ</div>
    <div class="facsel" id="facSel">
      <button class="fbtn on" data-f="wei" style="color:#7fa6e6">魏<small>君主 曹操</small></button>
      <button class="fbtn" data-f="shu" style="color:#7fd08f">蜀<small>君主 劉備</small></button>
      <button class="fbtn" data-f="wu" style="color:#f08a80">呉<small>君主 孫権</small></button>
      <button class="fbtn" data-f="qun" style="color:#c99ae0">群<small>君主 袁紹</small></button>
    </div>
    <div class="tlabel">難易度</div>
    <div class="seg" id="diffSel">
      <button data-d="easy">易しい</button>
      <button data-d="normal" class="on">普通</button>
      <button data-d="hard">難しい</button>
    </div>
    <button class="btn big" id="newBtn">新しく始める</button>
    <button class="btn sub big" id="contBtn" style="margin-top:10px">続きから</button>
  </div>
</div>

<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   定数・マスタデータ
   ========================================================= */
// マップの列数・行数（新しいゲームは20×22。以前の保存データは作ったときの大きさのまま）
const MAP_COLS = 20, MAP_ROWS = 22;
let COLS = MAP_COLS, ROWS = MAP_ROWS;
const R = 30;                        // 六角形の半径(px)
const HW = Math.sqrt(3) * R;         // 六角形の横幅
const PAD = 10;
let MAPW = 0, MAPH = 0;

    openModal(`<h2>馬防柵を攻撃</h2><p style="text-align:center">${fenceText(r)}</p><div class="mbtns"><button class="btn" id="mok">閉じる</button></div>`, '',
      () => { busy = false; sel = S.factions[P()].apos[a]; selArmy = a; renderAll(); });

  return `<g opacity="${dim ? 0.5 : 1}">
    <circle cx="${cx}" cy="${cy}" r="10.5" fill="#140f0b" fill-opacity=".6" stroke="${on ? '#fff3a0' : '#f0d27a'}" stroke-width="${on ? 3 : 1}"/>
    <circle cx="${cx}" cy="${cy - 4}" r="3.6" fill="${col}" stroke="#fff" stroke-width="1.2"/>
    <path d="M${cx - 6},${cy + 7.5} Q${cx - 6.5},${cy} ${cx},${cy} Q${cx + 6.5},${cy} ${cx + 6},${cy + 7.5} Z" fill="${col}" stroke="#fff" stroke-width="1.2"/>
    <text x="${cx + 8}" y="${cy - 5}" font-size="9" fill="#fff" stroke="#140f0b" stroke-width="2.5" paint-order="stroke" font-weight="bold">${num}</text></g>`;
}
// 馬防柵のマーク：杭を交差させた柵。建設中は半透明で残りターン、完成後は耐久のバー
function fenceIcon(x, y, fe) {
  const up = fe.left <= 0, ox = x - 15, oy = y + 1, col = FAC[fe.f] ? FAC[fe.f].col : '#888';
  let g = `<g pointer-events="none" opacity="${up ? 1 : 0.55}">`;
  g += `<rect x="${ox - 2}" y="${oy - 9}" width="18" height="15" rx="3" fill="#140f0b" fill-opacity=".75" stroke="${col}" stroke-width="1.2"/>`;
  for (let k = 0; k < 3; k++) { const sx = ox + 2 + k * 5; g += `<line x1="${sx - 2}" y1="${oy + 4}" x2="${sx + 2}" y2="${oy - 7}" stroke="#d9b072" stroke-width="1.8" stroke-linecap="round"/><line x1="${sx + 2}" y1="${oy + 4}" x2="${sx - 2}" y2="${oy - 7}" stroke="#d9b072" stroke-width="1.8" stroke-linecap="round"/>`; }
  g += `<line x1="${ox}" y1="${oy - 2}" x2="${ox + 14}" y2="${oy - 2}" stroke="#8a5a2a" stroke-width="2"/>`;
  if (up) g += `<rect x="${ox - 1}" y="${oy + 7}" width="16" height="3" fill="#0008"/><rect x="${ox - 1}" y="${oy + 7}" width="${16 * fe.hp / FENCE_HP}" height="3" fill="#e0a040"/>`;
  else g += `<text x="${ox + 7}" y="${oy + 14}" font-size="8" text-anchor="middle" fill="#fff3d6" stroke="#140f0b" stroke-width="2" paint-order="stroke">建${fe.left}</text>`;
  return g + `</g>`;
}

    });
    const d = hexXY(S.tiles[pendMove].c, S.tiles[pendMove].r);
    h += `<polyline points="${pts.join(' ')}" fill="none" stroke="#fff3a0" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" pointer-events="none"/>`;
    h += `<g data-id="${pendMove}"><polygon points="${hexPts(d.x, d.y, R - 2)}" fill="#fff3a0" fill-opacity="0.35" stroke="#fff3a0" stroke-width="3.5"/>

  S.tiles.forEach((t, i) => {
    const list = armiesAt(i);

    const { x, y } = hexXY(t.c, t.r);
    h += `<g data-id="${i}">`;
    list.forEach((o, k) => {
      const mine = o.f === P();

      h += personIcon(x - 9 + k * 9, y + 5 - k * 3, FAC[o.f].col, o.a + 1, dim, mine && selArmy === o.a);

// マップ下部の小さな案内表示。部隊を選択中は、その部隊の状態を1〜2行で出す（ウィンドウは開かない）
function updateHint(show) {
  const el = $('#mhint');
  if (!el) return;
  if (!show) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (selArmy == null) { el.innerHTML = '👤 部隊をタップ → 光るマスへ移動／赤い点線のマスを攻撃'; return; }

    const rs = reach(P(), selArmy), cost = rs.get(pendMove), steps = stepsTo(P(), S.factions[P()].apos[selArmy], pendMove);
    el.innerHTML = `<b>📍 「${tileName(S.tiles[pendMove])}」へ移動しますか？</b><br>移動力 -${cost}（残り${S.factions[P()].amp[selArmy] - cost}）／士気 -${steps * MORALE_STEP}
      <br><button class="minibtn" onclick="confirmMove()">移動する</button><button class="minibtn" style="background:#3a2e24" onclick="cancelMove()">やめる</button>
      <br><span style="color:var(--muted);font-size:11px">同じマスをすばやく2回タップすると、すぐ移動します</span>`;

  const e = engOf(P(), a), sgi = siegeOf(P(), a);

  } else if (e != null && !armyActed(P(), a) && F.amp[a] > 0) {

  { const here = F.apos[a], fe = S.tiles[here].fence;
    if (canFence(P(), here)) h += `<br><button class="minibtn" style="margin-left:0" onclick="orderFence(${here})">🚧 このマスに馬防柵を設置</button> <span style="font-size:11px;color:var(--muted)">${FENCE_BUILD}ターン後に完成（${fencesOf(P()).length}/${fenceLimit(P())}）</span>`;
    else if (fe && fe.f === P()) h += `<br><span style="font-size:12px">🚧 馬防柵${fe.left > 0 ? `建設中（あと${fe.left}ターン）` : `（耐久 ${fmt(fe.hp)}/${FENCE_HP}）`}</span>`;
    const cp = S.tiles[here].camp;

    else if (cp && cp.f === P()) h += `<br><span style="font-size:12px">⛺ 幕舎${cp.left > 0 ? `建設中（あと${cp.left}ヶ月）` : `：士気 毎ターン+${CAMP_REGEN}`}</span>`; }

    if (F.apos[a] !== capIdx(P()) && sgi == null && e == null) h += ` <button class="minibtn" style="background:#3a2e24" onclick="orderRetreat(${a})">🏯本城へ撤退</button>`; }

// マップ下の部隊タブ：自軍の部隊をタップで選択（選択中をもう一度タップで解除）
function renderABar() {
  const el = $('#abar'); if (!el || !S) return;

    const gs = armyGens(P(), a); if (!gs.length) continue;

  }
  el.innerHTML = btns.length ? btns.join('') : `<div class="none">部隊がありません。部隊タブで編成してください</div>`;
}
function abarPick(a) {

  }).join('') : `<div class="hint">在野の武将はまだ現れていません</div>`;

}

      <button class="btn sub" style="min-height:36px;padding:0 10px;font-size:13px;margin-left:6px" onclick="showTab('map');pickArmy(${a})">マップで見る</button></div>`;

      h += `<div class="slot"><label>所属</label><select onchange="setHome(${a},this.value)" ${edit ? '' : 'disabled'}><option value="" ${hm == null ? 'selected' : ''}>（未所属・本城から出陣／兵×${NOHOME_MULT}）</option>${opts}</select></div>`;
      if (hm != null && F.apos[a] !== hm && siegeOf(P(), a) == null) h += `<button class="btn sub wide" style="justify-content:center;margin:4px 0" onclick="orderRetreat(${a})">🏯 所属城「${tileName(S.tiles[hm])}」へ撤退する</button>`;

        : `<div class="srow" style="color:var(--muted);font-size:12px">同じ出身勢力の武将3人でそろえると部隊ボーナス（自勢力の出身なら×${UNITY_OWN}、他勢力の出身なら×${UNITY_OTHER}）</div>`; }
    if (gs.length) { const mo = moraleOf(P(), a), dn = Math.round((1 - moraleMult(P(), a)) * 1000) / 10;

    const at = armyType(P(), a);

      if (at === 'siege') h += `<div class="desc">兵器：城攻めでは攻撃力×${SIEGE_CASTLE}（関所・洛陽では×${GREAT_SIEGE}）、それ以外の戦闘では×${SIEGE_FIELD}。移動力-1。城・関所・洛陽・馬防柵を攻めるときは、どの兵種よりも攻撃力が高くなります。それ以外で武将が率いる騎・盾・弓・槍の部隊とぶつかると大きく不利（攻撃力×${SIEGE_VS_TROOP}、受ける一撃で兵の3/5を失う）。</div>`;

    }
    if (gs.length && inCastle) h += `<div class="bld"><div class="row" style="margin-top:10px"><div class="chips">${need > 0 ? costChips(c, F.res) : (armyRec(P(), a) ? '<span class="chip">今はこれ以上補充できません</span>' : '<span class="chip">兵は満員です</span>')}</div><button class="btn sub" ${need > 0 ? '' : 'disabled'} onclick="refill(${a})">兵を補充</button></div></div>`;
    if (gs.length) h += recLine(a);

    h += `</div>`;
  }
  const nextA = armyCount(P());
  if (nextA < MAX_ARMIES) h += `<div class="hint">🔒 兵舎を Lv${ARMY_UNLOCK[nextA]} にすると第${nextA + 1}部隊が解放されます（今は Lv${F.bld.barracks}）</div>`;
  $('#tab-army').innerHTML = h;
}

function playBattle(r, done) {
  const { res, A, D, tile, fac, prevOwner } = r, L = res.log;
  const uh = (u, side, i) => `<div class="bu" id="bu-${side}-${i}"><div class="bun"><span class="tb t-${u.type}">${TYPE[u.type].n}</span>${u.main ? '★' : ''}${u.name}</div><span class="bar"><em></em></span><div class="bnum"></div></div>`;
  const defName = r.defLabel;
  openModal(`<div class="btitle">⚔ ${tileName(tile)}の戦い${r.pincer ? '（挟撃）' : ''}</div>
    <div class="bt"><div><div class="bsh" style="color:${FAC[fac].col}">攻撃：${r.atkLabel}${r.pincer ? '<br>⚔挟撃' : ''}</div>${A.map((u, i) => uh(u, 'a', i)).join('')}</div>
    <div><div class="bsh" style="color:${prevOwner ? FAC[prevOwner].col : '#b3a284'}">防衛：${defName}</div>${D.map((u, i) => uh(u, 'd', i)).join('')}</div></div>
    <div class="blog" id="blog"></div><div id="bend"></div><div class="mbtns" id="bbtns"><button class="btn sub" id="bskip">スキップ</button></div>`, 'dark');
  const blog = $('#blog');
  const upd = (side, i, v, mx) => {
    const el = $(`#bu-${side}-${i}`); if (!el) return;
    el.querySelector('em').style.width = Math.max(0, v / mx * 100) + '%';
    el.querySelector('.bnum').textContent = fmt(v);
    el.classList.toggle('dead', v <= 0);
  };
  const flash = (id, c) => { const el = $('#' + id); if (!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
  const show = e => {
    e.a.forEach((v, i) => upd('a', i, v, A[i].max));
    e.d.forEach((v, i) => upd('d', i, v, D[i].max));
    const p = document.createElement('div');
    p.className = 'bl' + (e.hdr ? ' hdr' : '') + (e.strat ? ' strat' : '');
    p.textContent = e.txt; blog.appendChild(p); blog.scrollTop = blog.scrollHeight;
    if (e.hit) flash(`bu-${e.hit.side}-${e.hit.i}`, 'hit');
    if (e.from) flash(`bu-${e.from.side}-${e.from.i}`, 'act');
  };
  let k = 0, finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    clearInterval(timer);
    while (k < L.length) show(L[k++]);
    let msg = res.win ? (r.sieged ? `「${tileName(tile)}」の守りを破り、部隊が入った！<br>🚩 このまま${SIEGE_TURNS}ターン留まれば占領できます（その間に敵に撃退されると失敗）。`
        : r.broke && r.prevOwner === fac ? `制圧中の敵部隊を撃退し、「${tileName(tile)}」を守り切った！`
        : `「${tileName(tile)}」を占領し、部隊が進駐した！`)
      : res.draw ? `${MAX_ROUNDS}合で決着がつかなかった。両軍とも今の兵数のまま、その場で対峙する。<br>${fac === P() ? '次のターンに「戦闘再開」か「撤退」を選べます。' : ''}`
      : '部隊は壊滅し、最寄りの自軍の城へ退いた。';
    if (r.fenceStop) msg += `<br>🚧 建設中の馬防柵を打ち壊し、設置を阻止した！`;
    if (r.routedB && r.routedB.length && !res.lose) msg += `<br>💥 ${r.routedB.map(b => `第${b + 1}部隊`).join('・')}は主将が討たれて壊滅し、最寄りの城へ退いた。`;
    if (r.fell) msg += `<br>★ ${FAC[r.fell].n}の本拠地を陥落させた！ ${FAC[r.fell].n}は滅亡し、配下の武将は在野となった。`;
    if (r.ups.length) msg += `<br>レベルアップ：${r.ups.join('、')}`;
    $('#bend').innerHTML = `<div class="bres ${res.win ? 'win' : res.draw ? 'draw' : 'lose'}">${res.win ? '勝利' : res.draw ? '引き分け' : '敗北'}</div><div class="bmsg">${msg}</div>`;
    $('#bbtns').innerHTML = `<button class="btn" id="bclose">閉じる</button>`;
    $('#bclose').onclick = () => { closeModal(); done(); };
  };
  show(L[k++]);
  const timer = setInterval(() => { if (k >= L.length) finish(); else show(L[k++]); }, 420);
  $('#bskip').onclick = finish;
}

    <div class="mbtns"><button class="btn" id="mok">閉じる</button></div>`);

    <div class="mbtns"><button class="btn sub" id="mBack">一覧へ</button><button class="btn" id="mok">閉じる</button></div>`);

    <div class="mbtns"><button class="btn" id="mok">了解</button></div>`, '', done);

function showTutorial() {
  openModal(`<h2>遊び方</h2><ol>
    <li><b>目的</b>：都「洛陽」（⭐のマス）を占領し、${HOLD_TURNS}ターン守り抜けば勝利。敵3勢力の本拠地をすべて落としても勝利です。</li>

    <li><b>補充</b>：兵は自軍の城（🏯）に入城している部隊だけが補充できます（食糧と鉄を消費）。編成の変更も城の中だけです。兵種の相性は四すくみで、騎兵は盾兵に、盾兵は弓兵に、弓兵は槍兵に、槍兵は騎兵に強い（有利な相手には攻撃力×1.25、不利な相手には×0.8）。守備兵も騎・盾・弓・槍のうち3種類で守っているので、相手に合わせて兵種を選びましょう。</li>

    <li><b>河と港</b>：マップには河が流れ、河のマスには陸から入れません（攻めることもできません）。河を渡るには港を使います。河沿いにはランダムで港（⚓）があり、どちらの岸にも必ず港があります。港は最初は在地勢力が守っていて、使うには戦闘で制圧する必要があります。制圧した自軍の港どうしは、河の水がとぎれずにつながっていれば船で一気に移動できます（移動力${PORT_COST}）。途中に陸地（河の上の城など）がはさまる港へは行けません。勢力が滅びると、その勢力の港は在地勢力に戻ります。船で行けるのは港から港へだけで、河がつながっていない港へは行けません。港を押さえて水路を活用しましょう。制圧した自軍の港にいる部隊は、同じ河でつながった他の港を船から攻めることもできますが、攻撃側の攻撃力・防御力は×${NAVAL_MULT}になります。</li>

    <li><b>馬防柵</b>：自軍の領地（城以外）のマスを選んで「🚧 馬防柵を設置」を押すと、${FENCE_BUILD}ターン後に柵が完成します。設置できる数は本城の城壁のレベルで決まり、Lv1〜9は2つ、Lv10〜19は3つ、Lv20は4つです。建設中の柵があるマスで戦闘に勝つと、設置を阻止できます。完成した柵のあるマスを攻めるには、先に耐久${FENCE_HP}の柵を壊す必要があり、柵を攻撃した部隊も兵を少し失います。兵器や挟撃なら柵を早く壊せます。</li>
    <li><b>時間と作柄</b>：1ターンは1ヶ月です（3〜5月が春、6〜8月が夏、9〜11月が秋、12〜2月が冬）。7月か8月に、その年の秋が豊作・凶作になりそうかの見込みが知らされます（見込みは外れることもあります）。</li>
    <li><b>外交</b>：外交タブから敵国へ使者を送り、3・6・12・24ヶ月の同盟を結べます（1ヶ月に1回）。結べるかどうかは使者の知力・期間の長さ・相手の友好度で決まり、使者が「問題なさそうだ」「友好度を上げる必要がありそうだ」「難しい・・・」と見立てを伝えます。友好度は各国50から始まり（-300〜100。外交タブでは「同盟国・親密国・友好国・中立国・険悪国・敵対国」で表示）、資源を献上すると1〜10上がり、戦闘すると40下がります。同盟中はお互いの領地を攻められませんが、洛陽だけは同盟の対象外です。結びやすさは、領地が隣り合っているか（隣り合っていると結びやすい）と、勢力の大きさ（自国が大きいほど警戒される）にも左右されます。自国が抜きん出た最大勢力になると、CPUどうしが同盟を結んでそろって攻めてきます。CPUのどこかが最大勢力になると、ほかのCPUから対抗のための同盟の申し入れが届くことがあります。同盟国には外交タブから「通行許可」を求められ、許可されると同盟の間その国の領地を通ったり、城や土地に留まったりできます（城にいると士気+3）。許可される確率は友好度で決まり、友好度100で95%です。同盟が終わると、同盟国の領地にいた部隊は所属城へ引き上げます。CPUからも、同盟の申し入れや、同盟国からの通行許可の依頼が届きます。届いた依頼は外交タブ（未返事の件数が表示されます）で「許可する／断る」を選べます。返事をしないまま3ヶ月たつと取り下げられます。通行を許可した同盟国の部隊は、自国の領地を通れるようになります（外交タブでいつでも取り消せます）。戦っている国（対峙中・直近${TRUCE_WAR_TURNS}ターン以内に戦闘した・お互いの領地を制圧しようとしている）にだけ「停戦」（${TRUCE_MONTHS}ヶ月、お互いの領地を攻めない。洛陽は対象外）を申し込めます。応じてくれるかは使者の知力・友好度・情勢で決まり、どこかの国が強大になっていると応じやすくなります。1国が強大になると、ほかの国どうしは停戦して大国に備え、自国にも停戦の申し入れが届くことがあります。月ごとの報告は、マップ右上の「📜 報告」やメニューからいつでも見返せます（直近24ヶ月分）。CPUからも、友好度を上げるための「友好の使者」（資源の贈り物）が届くことがあります。受け取ると資源が手に入り友好度も上がります。断ると友好度が少し下がります。隣り合っている国、ほかに強大な国がある国、自国より小さい国ほど送ってきやすく、自国が最大勢力のときは来にくくなります。相手が申し出を受けるかどうかには、どれも友好度が影響します。同盟・停戦・通行許可は友好度が高いほど受けてもらいやすく、献上も険悪国・敵対国には突き返されることがあります（そのときは資源は減りません）。</li>
    <li><b>幕舎</b>：自軍の領地の平地を選んで「⛺ 幕舎を建設」を押すと、${CAMP_BUILD}ヶ月後に完成します。完成した幕舎のマスにいる部隊は、毎ターン士気が${CAMP_REGEN}回復します（幕舎のないマスで待機したときは1、城にいるときは3）。建てられる数は本城と支城の合計で決まり、2つまでは1つ、3〜4は2つ、5〜6は3つ、7以上は4つです。</li>
    <li><b>在地勢力の成長</b>：どの勢力のものでもない土地（在地勢力）の守備兵は、${WILD_EVERY}ターンごとに1段階ずつ強くなります（兵の上限+30%・能力+3、${WILD_MAX}段階まで。関所・洛陽は除く）。後半ほど土地を取るのが大変になるので、早めに領地を広げましょう。</li>
    <li><b>蛮族</b>：${WILD_EVERY}ターンごと（16・31・46…ターン目）に、マップ上のランダムな${BARB_N}か所に蛮族が現れます。蛮族のマスは赤く塗られ、🪓のマークが付きます。
      <br>・自軍やCPUの領地に現れると、その土地は蛮族に奪われます。そこにいた部隊は所属城（なければ本城）へ追い出され、馬防柵や幕舎もなくなります。支城が奪われると、所属していた部隊は空いている城へ移ります。
      <br>・本拠地・洛陽・関所・司隷（洛陽のまわり）には現れません。
      <br>・蛮族の守備兵は在地勢力より強く、遅い時期に現れたものほど強くなります。攻めて勝てば、中立地と同じようにすぐ占領できます。
      <br>・現れたときは、その月の報告に「🪓 蛮族が〇〇に現れ…」と出ます。</li>
    <li><b>武将の上限と解雇</b>：1勢力が持てる部隊は最大4つ、抱えられる武将は最大${GEN_MAX}人です。武将タブの「解雇する」で、配下の武将を手放せます（君主は除く。出陣中の部隊の武将は、城に戻ってから）。解雇した武将は部隊や担当官から外れて在野に戻り、他の勢力に登用されることもあります。</li>
    <li><b>所属城と収入</b>：部隊は本城か支城のどれか1つに所属します（1つの城に1部隊まで。部隊タブで変更）。始めは本城だけなので第2部隊は未所属です。城を攻め取って支城を増やし、所属させると上限が元に戻ります。未所属の部隊も本城にいれば出陣できますが、兵の上限と補充量が×0.85になります。部隊を選んで「🏯撤退」を押すと、所属城へ戻ります（そのターンの行動は終わり）。戦闘に負けたときも所属城へ戻ります。所属のない部隊は、壊滅したときも撤退するときも本城へ戻ります。自領の各マスは一番近い城の管轄になり、城ごとに収入が入ります（内政タブで確認。支城の管轄は本城の施設の効果が半分）。</li>
    <li><b>偵察</b>：マップ右上の「🔍 偵察」から、1ターンに1回、自陣とその隣のマスにいる敵部隊を調べられます。敵部隊の詳しい中身と勝率は、偵察するまで分かりません。任せる武将の知力で精度が変わり、知力85以上なら全武将の能力まで、70以上なら全武将と正確な兵数、50以上なら主将とおおよその兵数、50未満なら大まかな兵数だけ（見落としもあり）。情報はそのターンだけ有効です。</li>
    <li><b>能力</b>：武力＝通常攻撃（兵刃）の威力。知力＝計略の威力と、計略を受けたときの軽減。統率＝兵刃を受けたときの軽減。速度＝戦闘の行動順（速いほど先手を取り、計略で付けた炎上・中毒の持続ダメージも早く与えられる）。政治＝担当官として資源の産出を高める（戦闘には関係しません）。</li>
    <li><b>兵種と適性</b>：部隊ごとに騎兵・盾兵・弓兵・槍兵・兵器から兵種を選びます。騎兵→盾兵→弓兵→槍兵→騎兵の順に、矢印の先の兵種に強く（攻撃力×1.25）、逆向きには弱く（×0.8）なります（城の中でのみ変更可）。武将には兵種ごとに S〜D の適性があり、S は能力×1.15、A ×1.0、B ×0.85、C ×0.7、D ×0.55。兵器は城攻めに特化（城を攻めるとき攻撃力×${SIEGE_CASTLE}、他の兵種は×${CASTLE_ATK}。城を守る側は×${CASTLE_DEF}）ですが、城攻め以外では×${SIEGE_FIELD}で、移動力も1少なくなります。城・関所・洛陽・馬防柵を攻めるときは、守っているのが部隊でも、どの兵種よりも攻撃力が高くなります。一方、それ以外で武将が率いる騎兵・盾兵・弓兵・槍兵の部隊とぶつかると、兵器の攻撃力は×${SIEGE_VS_TROOP}になり、一撃受けるごとに兵の3/5を失います（城や土地の守備兵には当てはまりません）。兵器の部隊は、ほかの部隊と挟撃して守ってもらいましょう。</li>
    <li><b>貿易</b>：内政タブで資源を別の資源に交換できます。レートは季節で×0.5〜×1.5に変わります（例：秋の食糧は×0.5、冬の食糧は×1.5）。</li>
    <li><b>担当官</b>：内政タブで、資源ごとに武将を担当官に任命できます。政治60以上なら産出×1.2（40〜59は×1.1、40未満は×1.05）。副将は兼任できますが、部隊長（主将）は兼任できません。</li>
    <li><b>内政</b>：施設を強化すると資源の産出や兵力上限が上がります。ドラッグでマップ移動、2本指で拡大・縮小できます。</li>
    <li><b>ターン終了</b>：敵勢力が行動し、領地から資源が入ります。守備兵も少しずつ回復します。</li>
  </ol><div class="mbtns"><button class="btn" id="mok">はじめる</button></div>`, '', () => store.set(TUT_KEY, '1'));
}
function showMenu() {
  openModal(`<h2>メニュー</h2>
    <button class="btn sub big" style="width:100%" id="mLog">📜 これまでの報告</button>
    <button class="btn sub big" style="width:100%;margin-top:8px" id="mTut">遊び方</button>
    <button class="btn sub big" style="width:100%;margin-top:8px" id="mTitle">保存してタイトルへ</button>
    <div class="mbtns"><button class="btn" id="mok">閉じる</button></div>`);
  $('#mTut').onclick = showTutorial;
  $('#mLog').onclick = showLogs;
  $('#mTitle').onclick = () => { closeModal(); goTitle(); };
}

/* =========================================================
   マップのドラッグ・ピンチ操作
   ========================================================= */
function applyView() { $('#mapg').setAttribute('transform', `translate(${view.x.toFixed(1)},${view.y.toFixed(1)}) scale(${view.s.toFixed(3)})`); }
function clampView() {
  const svg = $('#map'), w = svg.clientWidth, h = svg.clientHeight;
  if (!w || !h) return;
  const mw = MAPW * view.s, mh = MAPH * view.s;
  view.x = mw < w ? (w - mw) / 2 : Math.min(40, Math.max(w - mw - 40, view.x));
  view.y = mh < h - 60 ? Math.min(40, Math.max(h - mh - 220, view.y)) : Math.min(40, Math.max(h - mh - 220, view.y));
}
function zoomAt(mx, my, f) {
  const ns = Math.min(2.5, Math.max(0.22, view.s * f));
  f = ns / view.s;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.s = ns;
}
function fitView() {
  const svg = $('#map'), w = svg.clientWidth, h = svg.clientHeight;
  if (!w || !S) return;
  view.s = Math.max(0.45, Math.min(2.5, w / (PAD * 2 + HW * 10.5) * 1.15));   // マップが広くなっても、マスの大きさは以前と同じにして本拠地を中心に表示
  const cap = S.tiles.find(t => t.cap === P()) || S.tiles[0];
  const { x, y } = hexXY(cap.c, cap.r);
  view.x = w / 2 - x * view.s; view.y = h / 2 - y * view.s;
  clampView(); applyView();
}
(function setupMapInput() {
  const svg = $('#map'), ptrs = new Map();
  let moved = 0;
  svg.addEventListener('pointerdown', e => {
    try { svg.setPointerCapture(e.pointerId); } catch (_) { }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = ptrs.size === 1 ? 0 : 99;      // 2本指以降はタップ扱いにしない
  });
  svg.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const nx = e.clientX, ny = e.clientY;
    if (ptrs.size === 1) {
      view.x += nx - p.x; view.y += ny - p.y;
      moved += Math.abs(nx - p.x) + Math.abs(ny - p.y);
    } else if (ptrs.size === 2) {
      const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(p.x - other.x, p.y - other.y), d1 = Math.hypot(nx - other.x, ny - other.y);
      const rect = svg.getBoundingClientRect();
      if (d0 > 0) zoomAt((nx + other.x) / 2 - rect.left, (ny + other.y) / 2 - rect.top, d1 / d0);
    }
    p.x = nx; p.y = ny;
    clampView(); applyView();
  });
  const end = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && moved < 10 && e.type === 'pointerup') {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('[data-id]') : null;
      selectTile(g ? +g.dataset.id : null);
    }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
    clampView(); applyView();
  }, { passive: false });
  window.addEventListener('resize', () => { clampView(); applyView(); });
})();

/* =========================================================
   画面遷移・初期化
   ========================================================= */
function showTab(name) {
  curTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + name));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'map') requestAnimationFrame(() => { clampView(); applyView(); });
}
function startUI() {
  setDims(S.cols || 10, S.rows || 12);              // 以前の保存データは10×12
  // 群が加わる前の保存データ：群は滅亡済みとして扱う
  for (const f in FAC) if (!S.factions[f]) S.factions[f] = { alive: false, res: { food: 0, wood: 0, iron: 0, stone: 0 }, bld: { farm: 1, lumber: 1, smith: 1, quarry: 1, barracks: 1, wall: 1 },
    roles: { food: null, wood: null, iron: null, stone: null }, armies: [[null, null, null], [null, null, null], [null, null, null], [null, null, null]],
    apos: [0, 0, 0, 0], amp: [0, 0, 0, 0], eng: [null, null, null, null], mor: [100, 100, 100, 100], home: [null, null, null, null] };
  if (!S.hold) S.hold = { owner: null, turns: 0 };   // 旧バージョンの保存データ対策
  { const ht = S.tiles.find(t => t.name === HOLD_CITY); if (ht && ht.garMax < HOLD_GAR) { ht.garMax = HOLD_GAR; if (!ht.owner) ht.gar = [HOLD_GAR, HOLD_GAR, HOLD_GAR]; } }
  // 武将を追加した後でも、以前の保存データで続きから遊べるようにする
  for (const f in FAC) { const F = S.factions[f]; if (F.atype) F.atype = F.atype.map(k => k === 'inf' ? 'shd' : k); }
  // 旧セーブ：所属城がなければ、部隊を空いている城に所属させる
  for (const f in FAC) { const F = S.factions[f]; if (F.home || !F.alive) continue;
    F.home = [null, null, null, null];
    for (let a = 0; a < MAX_ARMIES; a++) if (armyGens(f, a).length) autoHome(f, a); }
  clipAll();   // 未所属の部隊は兵の上限×0.85（以前の保存データも読み込み時に合わせる）
  setPortNets(S.tiles);   // 港の航路を水のマスだけで計算し直す（間に陸地がある港どうしは行き来できない）
  portCache = null;   // 旧セーブ：歩兵は盾兵に
  GEN.forEach(g => {
    if (!S.gens[g.id]) S.gens[g.id] = { lv: 1, exp: 0, troops: 0, owner: 'hidden', acted: false };
    if (S.gens[g.id].owner === 'free' && S.gens[g.id].since == null) S.gens[g.id].since = S.turn;   // 古いセーブ：今のターンに現れたものとして扱う   // 新しく加わった武将は未登場から
  });
  for (const f in S.factions) S.factions[f].armies = S.factions[f].armies.map(a => a.map(id => id && GB[id] ? id : null));
  // 部隊の位置がない旧データは、全部隊を本拠地に置く
  for (const f in S.factions) {
    const F = S.factions[f];
    if (!F.apos) { const ci = Math.max(0, capIdx(f)); F.apos = [ci, ci, ci]; F.amp = [0, 0, 0]; if (F.alive) resetMP(f); }
    // 部隊枠が3つだった旧データは4つに広げる
    while (F.armies.length < MAX_ARMIES) F.armies.push([null, null, null]);
    while (F.apos.length < MAX_ARMIES) F.apos.push(Math.max(0, capIdx(f)));
    while (F.amp.length < MAX_ARMIES) F.amp.push(0);
    for (const k in F.bld) F.bld[k] = Math.min(F.bld[k], BLD_MAX);
    if (!F.eng) F.eng = [null, null, null, null];
    rolesOf(f);
    if (!F.mor) F.mor = [MORALE_MAX, MORALE_MAX, MORALE_MAX, MORALE_MAX];
  }
  selArmy = null;
  $('#title').style.display = 'none';
  sel = null;
  showTab('map');
  renderAll();
  requestAnimationFrame(fitView);
  engSkip = false;
  if (!store.get(TUT_KEY)) showTutorial(); else promptEngage();
}
function goTitle() {
  if (S && !S.over) save();          // 決着済みのゲームは保存しない
  closeModal();
  $('#title').style.display = 'flex';
  $('#contBtn').style.display = loadSave() ? '' : 'none';
}
(function init() {
  let fac = 'wei', diff = 'normal';
  document.querySelectorAll('#facSel button').forEach(b => b.onclick = () => {
    fac = b.dataset.f; document.querySelectorAll('#facSel button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('#diffSel button').forEach(b => b.onclick = () => {
    diff = b.dataset.d; document.querySelectorAll('#diffSel button').forEach(x => x.classList.toggle('on', x === b));
  });
  // 新規開始：毎回マップを作り直す。確認は confirm() ではなくゲーム内の画面で行う
  // （confirm() はプレビュー画面や一部のアプリ内ブラウザで無効になり、押しても何も起きないため）
  const startNew = () => { store.del(SAVE_KEY); S = null; newGame(fac, diff); startUI(); };
  $('#newBtn').onclick = () => {
    if (!loadSave()) { startNew(); return; }
    openModal(`<h2>新しく始める</h2><p style="text-align:center">保存中のデータは消えます。<br>新しいマップで始めますか？</p>
      <div class="mbtns"><button class="btn sub" id="mNo">やめる</button><button class="btn" id="mok">始める</button></div>`, '', startNew);
    $('#mNo').onclick = closeModal;
  };
  $('#contBtn').onclick = () => { const d = loadSave(); if (d) { S = d; startUI(); } };
  $('#contBtn').style.display = loadSave() ? '' : 'none';
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $('#endBtn').onclick = endTurn;
  $('#menuBtn').onclick = showMenu;
})();
</script>
